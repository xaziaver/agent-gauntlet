[project]
language = "python"
src = "src/"
tests = "tests/"

[output]
max_diagnostics_per_gate = 10

[gates.protect]
require_lock = true

[gates.static]

[gates.size]
max_function_lines = 25
max_module_lines = 300

[gates.complexity]
max = 6

[gates.tests]

[gates.coverage]
line = 95
branch = 90
per_file_min = 80

[gates.crap]
max = 15

[gates.duplication]
max_duplicate_blocks = 0

[protect]
paths = ["gauntlet.toml", "gauntlet.lock.json", ".gauntlet/", ".claude/settings.json"]

[gates.acceptance]
features = "features/"
require_approved = true
mutate_examples = true
mutation_sample = 0
api_boundary = "tests/api"