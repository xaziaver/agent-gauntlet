[project]
language = "python"
src = "src/"
tests = "tests/"

[output]
max_diagnostics_per_gate = 10

[gates.static]

[gates.size]
max_function_lines = 25
max_module_lines = 300

[gates.complexity]
max = 6

[gates.tests]

[gates.coverage]
line = 95
branch = 90

[gates.crap]
max = 15

[gates.duplication]
max_duplicate_blocks = 0