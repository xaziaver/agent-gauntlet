[project]
name = "agent-gauntlet"
version = "0.1.0"
description = "Quality-gate harness for AI coding agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12",
  "radon>=6",
  "coverage>=7",
  "pytest>=8",
  "pytest-cov>=5",
  "pytest-bdd>=7",
  "ruff>=0.6",
  "mypy>=1.11",
]

[project.scripts]
gauntlet = "gauntlet.cli:app"

[dependency-groups]
dev = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gauntlet"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "C4", "PTH", "RET", "ARG"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG"]   # pytest fixtures arrive as unused-looking arguments

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
addopts = "--ignore=mutants"
