[project]
name = "agent-gauntlet"
version = "0.1.0"
description = "Quality-gate harness for AI coding agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["typer>=0.12"]

[project.scripts]
gauntlet = "gauntlet.cli:app"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11", "radon>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gauntlet"]

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true